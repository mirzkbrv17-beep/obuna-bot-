services:
  - type: web
    name: abu-sub-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: TASKS_CHANNEL_ID
        sync: false
      - key: OFFICIAL_CHANNEL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: abu-sub-db
          property: connectionString

databases:
  - name: abu-sub-db
    plan: free
